<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>颜康福 - 检验与影像报告看板</title>
    <style>
        :root {
            --bg-color: #f4f7f9;
            --card-bg: #ffffff;
            --primary-blue: #1e88e5;
            --light-blue: #e3f2fd;
            --text-main: #333333;
            --text-sub: #666666;
            --danger-red: #e53935;
            --success-green: #43a047;
            --border-color: #eeeeee;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-main); font-size: 14px; line-height: 1.5; padding-bottom: 20px; transition: all 0.3s; }
        .container { max-width: 600px; margin: 0 auto; padding: 10px; padding-top: 50px; }

        /* 切换按钮 */
        .toggle-btn {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 1000;
            padding: 8px 16px;
            background-color: var(--card-bg);
            color: var(--primary-blue);
            border: 2px solid var(--primary-blue);
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: all 0.3s;
        }
        .toggle-btn:active {
            transform: scale(0.95);
        }

        .header-card { background: linear-gradient(135deg, #1e88e5, #42a5f5); color: white; padding: 16px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(30, 136, 229, 0.2); }
        .header-card h1 { font-size: 18px; margin-bottom: 8px; font-weight: 600; }
        .patient-info { display: flex; flex-wrap: wrap; gap: 10px; font-size: 13px; opacity: 0.9; }

        .diagnosis-box { background-color: var(--card-bg); border-left: 4px solid var(--primary-blue); padding: 12px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
        .diagnosis-box h3 { font-size: 15px; color: var(--primary-blue); margin-bottom: 6px; }
        .diagnosis-box p { font-size: 13px; color: var(--text-sub); line-height: 1.6; }

        details { background-color: var(--card-bg); border-radius: 10px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.03); overflow: hidden; }
        summary { padding: 15px; font-weight: 600; font-size: 15px; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; background-color: var(--card-bg); border-bottom: 1px solid transparent; transition: all 0.2s; }
        details[open] summary { border-bottom: 1px solid var(--border-color); background-color: var(--light-blue); color: var(--primary-blue); }
        summary::-webkit-details-marker { display: none; }
        summary::after { content: "▼"; font-size: 10px; color: var(--text-sub); transition: transform 0.3s; }
        details[open] summary::after { transform: rotate(180deg); color: var(--primary-blue); }

        .indicator-list { padding: 5px 10px; }
        .indicator-item { display: flex; justify-content: space-between; align-items: flex-start; padding: 12px 8px; border-bottom: 1px dashed var(--border-color); cursor: pointer; transition: background-color 0.2s; }
        .indicator-item:last-child { border-bottom: none; }
        .indicator-item:active { background-color: #f9f9f9; }

        .indicator-name { flex: 1; font-weight: 500; padding-right: 10px; word-break: break-all; }
        .indicator-value-box { text-align: right; min-width: 130px; }
        .indicator-value { font-weight: bold; font-size: 15px; }
        .indicator-ref { font-size: 11px; color: var(--text-sub); margin-top: 2px; }
        .abnormal { color: var(--danger-red); }
        
        .trend-info { font-size: 11px; margin-top: 4px; font-weight: normal; }
        .delta-up { color: var(--danger-red); }
        .delta-down { color: var(--success-green); }
        .delta-stable { color: var(--text-sub); }

        .chart-wrapper { width: 100%; display: none; border-top: 1px dashed var(--border-color); padding: 10px 0; background-color: #fafafa;}
        .chart-wrapper.active { display: block; }
        .chart-container { width: 100%; height: 180px; margin-bottom: 10px; position: relative; overflow: hidden; }
        
        .interpretation-box { background-color: var(--light-blue); border-radius: 8px; padding: 12px; margin-top: 5px; border-left: 4px solid var(--primary-blue); }
        .interpretation-box p { font-size: 13px; margin-bottom: 6px; color: var(--text-main); line-height: 1.6; }
        .interpretation-box p:last-child { margin-bottom: 0; }
        .interpretation-box .label { font-weight: bold; color: var(--primary-blue); }

        canvas { display: block; width: 100%; height: 100%; }
        .single-data-tip, .error-tip { font-size: 12px; color: #999; text-align: center; padding: 60px 0; }

        /* ================= 老年版专属样式 ================= */
        body.elder-mode { font-size: 18px; }
        body.elder-mode .container { padding: 15px; padding-top: 60px; }
        
        body.elder-mode .toggle-btn { font-size: 16px; padding: 10px 20px; background-color: #fff; border-color: #1e88e5; }
        
        body.elder-mode .header-card h1 { font-size: 24px; }
        body.elder-mode .patient-info { font-size: 16px; gap: 15px; }
        
        body.elder-mode .diagnosis-box h3 { font-size: 20px; }
        body.elder-mode .diagnosis-box p { font-size: 16px; line-height: 1.8; }
        
        body.elder-mode summary { font-size: 20px; padding: 20px 15px; }
        body.elder-mode .indicator-item { padding: 18px 8px; }
        body.elder-mode .indicator-name { font-size: 18px; }
        body.elder-mode .indicator-value { font-size: 22px; }
        body.elder-mode .indicator-value span { font-size: 14px !important; }
        body.elder-mode .indicator-ref { font-size: 14px; margin-top: 4px; }
        body.elder-mode .trend-info { font-size: 14px; margin-top: 6px; }
        
        body.elder-mode .chart-container { height: 240px; }
        body.elder-mode .interpretation-box { padding: 16px; }
        body.elder-mode .interpretation-box p { font-size: 16px; line-height: 1.8; margin-bottom: 10px; }
        body.elder-mode .interpretation-box .label { font-size: 18px; }
    </style>
</head>
<body>
    <!-- 切换按钮 -->
    <button class="toggle-btn" id="toggleBtn">老年版</button>

    <div class="container">
        <div class="header-card">
            <h1>颜康福的检验与影像报告趋势</h1>
            <div class="patient-info">
                <span>男 / 55岁</span>
                <span>病历号: 0007340107</span>
                <span>诊断: 肝硬化(F4)</span>
            </div>

        <div class="diagnosis-box">
            <h3>综合诊断与总体解读 (截至11.13)</h3>

        </div>

        <div id="accordion-container"></div>
        <div class="tip" style="text-align:center; font-size:12px; color:#999; margin-top:10px;">点击任意指标查看趋势图与专业建议</div>
    </div>

            {
                groupName: "肾功能与心肌酶",
                indicators: [
                    { name: "尿素氮 (BUN)", unit: "mmol/L", ref: "1.7-8.3", values: [{date: "2026-03-23", val: 6.04, abnormal: false}, {date: "2026-07-27", val: 4.43, abnormal: false}, {date: "2026-10-12", val: 5.54, abnormal: false}], interpretation: "尿素氮正常。", suggestion: "多饮水。" },
                    { name: "肌酐 (CREA)", unit: "umol/L", ref: "45-104", values: [{date: "2026-03-23", val: 63, abnormal: false}, {date: "2026-07-27", val: 69, abnormal: false}, {date: "2026-10-12", val: 71, abnormal: false}], interpretation: "肌酐稳定在正常范围。", suggestion: "谨慎使用肾毒性药物。" },
                    { name: "尿酸 (URIC)", unit: "umol/L", ref: "170-420", values: [{date: "2026-03-23", val: 293, abnormal: false}, {date: "2026-07-27", val: 306, abnormal: false}, {date: "2026-10-12", val: 299, abnormal: false}], interpretation: "尿酸正常。", suggestion: "保持低嘌呤饮食。" }
                ]
            },
            {
                groupName: "凝血功能",
                indicators: [
                    { name: "凝血酶原时间 (PT)", unit: "S", ref: "9.4-12.5", values: [{date: "2026-07-27", val: 11.60, abnormal: false}, {date: "2026-10-12", val: 13.30, abnormal: true}], interpretation: "PT延长，提示肝脏合成凝血因子的功能减退。", suggestion: "注意安全防跌倒。拔牙或手术前需告知医生。" },
                    { name: "国际标准化比值 (INR)", unit: "", ref: "0.85-1.14", values: [{date: "2026-07-27", val: 1.07, abnormal: false}, {date: "2026-10-12", val: 1.07, abnormal: false}], interpretation: "INR稳定在正常范围。", suggestion: "继续定期复查。" },
                    { name: "部分凝血酶原时间 (APTT)", unit: "S", ref: "25.1-36.5", values: [{date: "2026-07-27", val: 31.50, abnormal: false}, {date: "2026-10-12", val: 33.30, abnormal: false}], interpretation: "APTT正常。", suggestion: "无需特殊处理。" },
                    { name: "纤维蛋白原 (FIB)", unit: "g/L", ref: "2.38-4.96", values: [{date: "2026-07-27", val: 2.66, abnormal: false}, {date: "2026-10-12", val: 2.53, abnormal: false}], interpretation: "纤维蛋白原正常。", suggestion: "无需特殊处理。" }
                ]
            },
            {
                groupName: "乙肝病毒",
                indicators: [
                    { name: "乙肝表面抗原 (HBsAg)", unit: "IU/ml", ref: "<0.05", values: [{date: "2026-03-23", val: 947.632, abnormal: true}, {date: "2026-07-27", val: 1169.804, abnormal: true}], interpretation: "表面抗原阳性，提示体内仍有乙肝病毒。", suggestion: "坚持遵医嘱服用抗病毒药物，不可擅自停药。" },
                    { name: "乙肝DNA定量 (HBV-DNA)", unit: "IU/ml", ref: "0-50", values: [{date: "2026-07-27", val: 49, abnormal: false}], interpretation: "病毒DNA定量小于50 IU/ml，病毒复制被完全抑制。", suggestion: "继续坚持抗病毒治疗，这是阻止肝硬化进展最关键的一步。" }
                ]
            }
        ];

        // 老年模式切换逻辑
        const toggleBtn = document.getElementById('toggleBtn');
        const body = document.body;

        // 初始化检查本地存储
        if (localStorage.getItem('elderMode') === 'true') {
            body.classList.add('elder-mode');
            toggleBtn.textContent = '普通版';
        }

        toggleBtn.addEventListener('click', () => {
            body.classList.toggle('elder-mode');
            const isElder = body.classList.contains('elder-mode');
            toggleBtn.textContent = isElder ? '普通版' : '老年版';
            localStorage.setItem('elderMode', isElder);
            
            // 切换时收起所有已展开的图表，防止尺寸计算错误
            document.querySelectorAll('.chart-wrapper').forEach(div => {
                div.classList.remove('active');
            });
        });

        function initPage() {
            const accordionContainer = document.getElementById('accordion-container');

            medicalData.forEach((group, gIndex) => {
                const details = document.createElement('details');
                details.open = (gIndex === 0 || gIndex === 1 || gIndex === 2 || gIndex === 3);
                
                const summary = document.createElement('summary');
                summary.textContent = group.groupName;
                details.appendChild(summary);

                const listDiv = document.createElement('div');
                listDiv.className = 'indicator-list';

                group.indicators.forEach((indicator, iIndex) => {
                    const latestData = indicator.values.length > 0 ? indicator.values[indicator.values.length - 1] : null;
                    const prevData = indicator.values.length > 1 ? indicator.values[indicator.values.length - 2] : null;
                    
                    let deltaText = '';
                    let deltaClass = '';
                    if (prevData && latestData) {
                        const diff = (latestData.val - prevData.val).toFixed(2);
                        if (diff > 0) { deltaText = `较上次 ↑${diff}`; deltaClass = 'delta-up'; }
                        else if (diff < 0) { deltaText = `较上次 ↓${Math.abs(diff)}`; deltaClass = 'delta-down'; }
                        else { deltaText = `较上次持平`; deltaClass = 'delta-stable'; }
                    } else if (latestData) {
                        deltaText = '单次检测';
                        deltaClass = 'delta-stable';
                    }

                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'indicator-item';
                    
                    const chartId = `chart-${gIndex}-${iIndex}`;
                    itemDiv.onclick = () => toggleChart(itemDiv, indicator, chartId);

                    let valueHtml = '';
                    if (latestData) {
                        valueHtml = `
                            <div class="indicator-value ${latestData.abnormal ? 'abnormal' : ''}">
                                ${latestData.val} <span style="font-size:12px; font-weight:normal; color:#666;">${indicator.unit}</span>
                            </div>
                            <div class="indicator-ref">参考: ${indicator.ref}</div>
                            ${indicator.values.length > 1 ? `<div class="trend-info ${deltaClass}">${deltaText}</div>` : ''}
                        `;
                    } else {
                        valueHtml = `<div class="indicator-value" style="font-size:13px; color:#666;">详见描述</div>`;
                    }

                    itemDiv.innerHTML = `
                        <div class="indicator-name">${indicator.name}</div>
                        <div class="indicator-value-box">
                            ${valueHtml}
                        </div>
                    `;

                    const wrapperDiv = document.createElement('div');
                    wrapperDiv.className = 'chart-wrapper';
                    wrapperDiv.id = `wrapper-${chartId}`;

                    const chartDiv = document.createElement('div');
                    chartDiv.className = 'chart-container';
                    chartDiv.id = chartId;

                    const interpretDiv = document.createElement('div');
                    interpretDiv.className = 'interpretation-box';
                    interpretDiv.innerHTML = `
                        <p><span class="label">📈 变化诊断：</span>${indicator.interpretation}</p>
                        <p><span class="label">💡 专业建议：</span>${indicator.suggestion}</p>
                    `;

                    wrapperDiv.appendChild(chartDiv);
                    wrapperDiv.appendChild(interpretDiv);

                    const container = document.createElement('div');
                    container.appendChild(itemDiv);
                    container.appendChild(wrapperDiv);
                    listDiv.appendChild(container);
                });

                details.appendChild(listDiv);
                accordionContainer.appendChild(details);
            });
        }

        function toggleChart(element, indicator, chartId) {
            const wrapperDiv = document.getElementById(`wrapper-${chartId}`);
            const isActive = wrapperDiv.classList.contains('active');
            
            document.querySelectorAll('.chart-wrapper').forEach(div => {
                div.classList.remove('active');
            });

            if (!isActive) {
                wrapperDiv.classList.add('active');
                setTimeout(() => {
                    const chartContainer = document.getElementById(chartId);
                    if (indicator.values && indicator.values.length > 1) {
                        chartContainer.style.display = 'block';
                        drawNativeChart(chartContainer, indicator);
                    } else if (indicator.values && indicator.values.length === 1) {
                        chartContainer.style.display = 'block';
                        chartContainer.innerHTML = '<div class="single-data-tip" style="padding: 40px 0; font-size: 14px;">仅有一次数值记录，暂无趋势图（详见下方解读）</div>';
                    } else {
                        chartContainer.style.display = 'none';
                    }
                }, 50);
            }
        }

        function drawNativeChart(container, indicator) {
            container.innerHTML = '';
            const canvas = document.createElement('canvas');
            container.appendChild(canvas);
            
            const width = container.clientWidth || 300;
            const height = container.clientHeight || 180;
            
            const dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
            
            const ctx = canvas.getContext('2d');
            ctx.scale(dpr, dpr);

            // 判断是否为老年版，调整绘图参数
            const isElder = document.body.classList.contains('elder-mode');
            const padding = { top: isElder ? 30 : 20, right: 20, bottom: isElder ? 30 : 25, left: isElder ? 50 : 40 };
            const graphWidth = width - padding.left - padding.right;
            const graphHeight = height - padding.top - padding.bottom;

            const data = indicator.values;
            const values = data.map(d => d.val);
            const maxVal = Math.max(...values);
            const minVal = Math.min(...values);
            
            let range = maxVal - minVal;
            if (range === 0) range = Math.abs(maxVal) * 0.2 || 1;
            
            const yMax = maxVal + range * 0.1;
            const yMin = Math.max(0, minVal - range * 0.1);

            ctx.strokeStyle = '#eeeeee';
            ctx.lineWidth = 1;
            ctx.fillStyle = '#666666';
            ctx.font = isElder ? '13px sans-serif' : '10px sans-serif';
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';

            const ySteps = 4;
            for (let i = 0; i <= ySteps; i++) {
                const val = yMax - (i * (yMax - yMin) / ySteps);
                const y = padding.top + graphHeight * (i / ySteps);
                ctx.beginPath();
                ctx.moveTo(padding.left, y);
                ctx.lineTo(width - padding.right, y);
                ctx.stroke();
                ctx.fillText(val.toFixed(1), padding.left - 8, y);
            }

            const xStep = graphWidth / (data.length - 1 || 1);
            const points = data.map((d, i) => {
                const x = padding.left + i * xStep;
                const ratio = (d.val - yMin) / (yMax - yMin);
                const y = padding.top + graphHeight - (ratio * graphHeight);
                return { x, y, val: d.val, date: d.date.substring(5) };
            });

            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            points.forEach(p => {
                ctx.fillText(p.date, p.x, height - padding.bottom + 8);
            });

            ctx.beginPath();
            ctx.strokeStyle = '#42a5f5';
            ctx.lineWidth = isElder ? 5 : 3;
            ctx.lineJoin = 'round';
            points.forEach((p, i) => {
                if (i === 0) ctx.moveTo(p.x, p.y);
                else ctx.lineTo(p.x, p.y);
            });
            ctx.stroke();

            ctx.beginPath();
            points.forEach((p, i) => {
                if (i === 0) ctx.moveTo(p.x, p.y);
                else ctx.lineTo(p.x, p.y);
            });
            ctx.lineTo(points[points.length - 1].x, padding.top + graphHeight);
            ctx.lineTo(points[0].x, padding.top + graphHeight);
            ctx.closePath();
            const gradient = ctx.createLinearGradient(0, padding.top, 0, padding.top + graphHeight);
            gradient.addColorStop(0, 'rgba(66, 165, 245, 0.4)');
            gradient.addColorStop(1, 'rgba(66, 165, 245, 0.05)');
            ctx.fillStyle = gradient;
            ctx.fill();

            points.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, isElder ? 6 : 4, 0, Math.PI * 2);
                ctx.fillStyle = '#1e88e5';
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = isElder ? 3 : 2;
                ctx.stroke();

                ctx.fillStyle = '#333333';
                ctx.font = isElder ? 'bold 15px sans-serif' : 'bold 11px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                ctx.fillText(p.val, p.x, p.y - (isElder ? 12 : 8));
            });
        }

        window.addEventListener('DOMContentLoaded', initPage);
    </script>
</body>
</html>
