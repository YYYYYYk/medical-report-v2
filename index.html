    <style>

        .container { max-width: 600px; margin: 0 auto; padding: 10px; }

        .header-card { background: linear-gradient(135deg, #1e88e5, #42a5f5); color: white; padding: 16px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(30, 136, 229, 0.2); }

        .patient-info { display: flex; flex-wrap: wrap; gap: 10px; font-size: 13px; opacity: 0.9; }

        .diagnosis-box { background-color: var(--card-bg); border-left: 4px solid var(--primary-blue); padding: 12px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
        .diagnosis-box h3 { font-size: 15px; color: var(--primary-blue); margin-bottom: 6px; }
        .diagnosis-box p { font-size: 13px; color: var(--text-sub); line-height: 1.6; }

        details { background-color: var(--card-bg); border-radius: 10px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.03); overflow: hidden; }
        summary { padding: 15px; font-weight: 600; font-size: 15px; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; background-color: var(--card-bg); border-bottom: 1px solid transparent; transition: all 0.2s; }
        details[open] summary { border-bottom: 1px solid var(--border-color); background-color: var(--light-blue); color: var(--primary-blue); }
        summary::-webkit-details-marker { display: none; }
        summary::after { content: "▼"; font-size: 10px; color: var(--text-sub); transition: transform 0.3s; }
        details[open] summary::after { transform: rotate(180deg); color: var(--primary-blue); }

        .indicator-list { padding: 5px 10px; }
        .indicator-item { display: flex; justify-content: space-between; align-items: flex-start; padding: 12px 8px; border-bottom: 1px dashed var(--border-color); cursor: pointer; transition: background-color 0.2s; }
        .indicator-item:last-child { border-bottom: none; }
        .indicator-item:active { background-color: #f9f9f9; }

        .indicator-name { flex: 1; font-weight: 500; padding-right: 10px; word-break: break-all; }
        .indicator-value-box { text-align: right; min-width: 130px; }
        .indicator-value { font-weight: bold; font-size: 15px; }
        .indicator-ref { font-size: 11px; color: var(--text-sub); margin-top: 2px; }
        .abnormal { color: var(--danger-red); }
        
        .trend-info { font-size: 11px; margin-top: 4px; font-weight: normal; }
        .delta-up { color: var(--danger-red); }
        .delta-down { color: var(--success-green); }
        .delta-stable { color: var(--text-sub); }

        .chart-wrapper { width: 100%; display: none; border-top: 1px dashed var(--border-color); padding: 10px 0; background-color: #fafafa;}
        .chart-wrapper.active { display: block; }
        .chart-container { width: 100%; height: 180px; margin-bottom: 10px; position: relative; overflow: hidden; }
        
        .interpretation-box { background-color: var(--light-blue); border-radius: 8px; padding: 12px; margin-top: 5px; border-left: 4px solid var(--primary-blue); }
        .interpretation-box p { font-size: 13px; margin-bottom: 6px; color: var(--text-main); line-height: 1.6; }
        .interpretation-box p:last-child { margin-bottom: 0; }
        .interpretation-box .label { font-weight: bold; color: var(--primary-blue); }

        canvas { display: block; width: 100%; height: 100%; }
        .single-data-tip, .error-tip { font-size: 12px; color: #999; text-align: center; padding: 60px 0; }
    </style>
</head>

                    { name: "乙肝表面抗体 (HBsAb)", unit: "mIU/ml", ref: "<10", values: [{date: "2026-07-27", val: 4.000, abnormal: false}], interpretation: "表面抗体阴性，说明目前没有保护性抗体。", suggestion: "在病毒未完全清除前，无需注射疫苗，继续抗病毒治疗即可。" },
                    { name: "乙肝e抗原 (HBeAg)", unit: "IU/ml", ref: "<0.100", values: [{date: "2026-07-27", val: 0.040, abnormal: false}], interpretation: "e抗原阴性，提示病毒复制活跃度较低。", suggestion: "继续保持。" },
                    { name: "乙肝e抗体 (HBeAb)", unit: "IU/ml", ref: "<0.200", values: [{date: "2026-07-27", val: 0.336, abnormal: true}], interpretation: "e抗体阳性，结合表面抗原、核心抗体阳性，即为“小三阳”状态。", suggestion: "注意休息，避免劳累。" },
                    { name: "乙肝核心抗体 (HBcAb)", unit: "IU/ml", ref: "<0.600", values: [{date: "2026-07-27", val: 10.000, abnormal: true}], interpretation: "核心抗体阳性，代表既往感染或现行感染。", suggestion: "结合其他指标综合判断，定期随访。" },
                    { name: "乙肝DNA定量 (HBV-DNA)", unit: "IU/ml", ref: "0-50", values: [{date: "2026-07-27", val: 49, abnormal: false}], interpretation: "病毒DNA定量小于50 IU/ml（检测下限），说明抗病毒治疗效果显著，病毒复制已被完全抑制。", suggestion: "继续坚持抗病毒治疗，这是阻止肝硬化进展最关键的一步。" }
                ]
            },
            {
                groupName: "肝纤维化与肝弹",
                indicators: [
                    { name: "血清透明质酸 (HA)", unit: "ng/mL", ref: "<100", values: [{date: "2026-07-27", val: 103.93, abnormal: true}], interpretation: "透明质酸轻度偏高(103.93)，是肝纤维化的血清学指标之一，结合超声和肝弹结果，印证了肝硬化的存在。", suggestion: "继续抗纤维化治疗（如有），定期复查肝纤维化四项。" },
                    { name: "III型前胶原N端肽 (PIIINP)", unit: "ng/mL", ref: "0-30", values: [{date: "2026-07-27", val: 8.64, abnormal: false}], interpretation: "PIIINP正常，肝纤维化合成活动不活跃。", suggestion: "继续保持。" },
                    { name: "IV型胶原 (CoI IV)", unit: "ng/mL", ref: "<30", values: [{date: "2026-07-27", val: 25.05, abnormal: false}], interpretation: "IV型胶原正常，基底膜胶原沉积不明显。", suggestion: "无需特殊处理。" },
                    { name: "层粘连蛋白 (LN)", unit: "ng/mL", ref: "<50", values: [{date: "2026-07-27", val: 9.54, abnormal: false}], interpretation: "层粘连蛋白正常。", suggestion: "保持良好生活习惯。" },
                    { name: "肝脏硬度中位数 (SWE)", unit: "kPa", ref: "<5.48(F0)", values: [{date: "2026-03-24", val: 15.1, abnormal: true}, {date: "2026-07-28", val: 13.22, abnormal: true}], interpretation: "肝脏硬度从15.1kPa下降至13.22kPa。虽有所改善（提示肝纤维化可能部分逆转或炎症水肿消退），但仍远高于11.9kPa的F4级（肝硬化）标准。", suggestion: "坚持病因治疗（抗病毒），定期复查肝弹。绝对禁止饮酒，避免加重肝脏损伤。" }
                ]
            },
            {
                groupName: "肿瘤标志物",
                indicators: [
                    { name: "甲胎蛋白 (AFP)", unit: "ng/ml", ref: "0.5-8.1", values: [{date: "2026-07-27", val: 2.70, abnormal: false}], interpretation: "AFP正常，是筛查肝癌的重要指标，目前未见异常升高。", suggestion: "每3-6个月复查一次AFP和肝脏超声，坚持防癌筛查。" },
                    { name: "癌胚抗原 (CEA)", unit: "ng/ml", ref: "0.3-5", values: [{date: "2026-07-27", val: 2.48, abnormal: false}], interpretation: "CEA正常，未见消化道肿瘤迹象。", suggestion: "定期复查。" },
                    { name: "糖类抗原CA19-9", unit: "U/mL", ref: "0-39", values: [{date: "2026-07-27", val: 18.25, abnormal: false}], interpretation: "CA19-9正常。", suggestion: "注意胆囊结石的随访，若出现腹痛、发热及时就医。" }
                ]
            }
        ];

        function initPage() {
            const accordionContainer = document.getElementById('accordion-container');

            medicalData.forEach((group, gIndex) => {
                const details = document.createElement('details');
                details.open = gIndex === 0;
                
                const summary = document.createElement('summary');
                summary.textContent = group.groupName;
                details.appendChild(summary);

                const listDiv = document.createElement('div');
                listDiv.className = 'indicator-list';

                group.indicators.forEach((indicator, iIndex) => {
                    const latestData = indicator.values[indicator.values.length - 1];
                    const prevData = indicator.values.length > 1 ? indicator.values[indicator.values.length - 2] : null;
                    
                    let deltaText = '';
                    let deltaClass = '';
                    if (prevData) {
                        const diff = (latestData.val - prevData.val).toFixed(2);
                        if (diff > 0) { deltaText = `较上次 ↑${diff}`; deltaClass = 'delta-up'; }
                        else if (diff < 0) { deltaText = `较上次 ↓${Math.abs(diff)}`; deltaClass = 'delta-down'; }
                        else { deltaText = `较上次持平`; deltaClass = 'delta-stable'; }
                    } else {
                        deltaText = '单次检测';
                        deltaClass = 'delta-stable';
                    }

                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'indicator-item';
                    
                    const chartId = `chart-${gIndex}-${iIndex}`;
                    itemDiv.onclick = () => toggleChart(itemDiv, indicator, chartId);

                    itemDiv.innerHTML = `
                        <div class="indicator-name">${indicator.name}</div>
                        <div class="indicator-value-box">
                            <div class="indicator-value ${latestData.abnormal ? 'abnormal' : ''}">
                                ${latestData.val} <span style="font-size:12px; font-weight:normal; color:#666;">${indicator.unit}</span>
                            </div>
                            <div class="indicator-ref">参考: ${indicator.ref}</div>
                            ${indicator.values.length > 1 ? `<div class="trend-info ${deltaClass}">${deltaText}</div>` : ''}
                        </div>
                    `;

                    const wrapperDiv = document.createElement('div');
                    wrapperDiv.className = 'chart-wrapper';
                    wrapperDiv.id = `wrapper-${chartId}`;

                    const chartDiv = document.createElement('div');
                    chartDiv.className = 'chart-container';
                    chartDiv.id = chartId;

                    const interpretDiv = document.createElement('div');
                    interpretDiv.className = 'interpretation-box';
                    interpretDiv.innerHTML = `
                        <p><span class="label">📈 变化诊断：</span>${indicator.interpretation}</p>
                        <p><span class="label">💡 专业建议：</span>${indicator.suggestion}</p>
                    `;

                    wrapperDiv.appendChild(chartDiv);
                    wrapperDiv.appendChild(interpretDiv);

                    const container = document.createElement('div');
                    container.appendChild(itemDiv);
                    container.appendChild(wrapperDiv);
                    listDiv.appendChild(container);
                });

                details.appendChild(listDiv);
                accordionContainer.appendChild(details);
            });
        }

        function toggleChart(element, indicator, chartId) {
            const wrapperDiv = document.getElementById(`wrapper-${chartId}`);
            const isActive = wrapperDiv.classList.contains('active');
            
            document.querySelectorAll('.chart-wrapper').forEach(div => {
                div.classList.remove('active');
            });

            if (!isActive) {
                wrapperDiv.classList.add('active');
                setTimeout(() => {
                    const chartContainer = document.getElementById(chartId);
                    if (indicator.values.length > 1) {
                        drawNativeChart(chartContainer, indicator);
                    } else {
                        chartContainer.innerHTML = '<div class="single-data-tip">仅有一次检测记录，暂无趋势图</div>';
                    }
                }, 50);
            }
        }

        function drawNativeChart(container, indicator) {
            container.innerHTML = '';
            const canvas = document.createElement('canvas');
            container.appendChild(canvas);
            
            const width = container.clientWidth || 300;
            const height = container.clientHeight || 180;
            
            const dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
            
            const ctx = canvas.getContext('2d');
            ctx.scale(dpr, dpr);

            const padding = { top: 20, right: 20, bottom: 25, left: 40 };
            const graphWidth = width - padding.left - padding.right;
            const graphHeight = height - padding.top - padding.bottom;

            const data = indicator.values;
            const values = data.map(d => d.val);
            const maxVal = Math.max(...values);
            const minVal = Math.min(...values);
            
            let range = maxVal - minVal;
            if (range === 0) range = Math.abs(maxVal) * 0.2 || 1;
            
            const yMax = maxVal + range * 0.1;
            const yMin = Math.max(0, minVal - range * 0.1);

            ctx.strokeStyle = '#eeeeee';
            ctx.lineWidth = 1;
            ctx.fillStyle = '#666666';
            ctx.font = '10px sans-serif';
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';

            const ySteps = 4;
            for (let i = 0; i <= ySteps; i++) {
                const val = yMax - (i * (yMax - yMin) / ySteps);
                const y = padding.top + graphHeight * (i / ySteps);
                ctx.beginPath();
                ctx.moveTo(padding.left, y);
                ctx.lineTo(width - padding.right, y);
                ctx.stroke();
                ctx.fillText(val.toFixed(1), padding.left - 5, y);
            }

            const xStep = graphWidth / (data.length - 1 || 1);
            const points = data.map((d, i) => {
                const x = padding.left + i * xStep;
                const ratio = (d.val - yMin) / (yMax - yMin);
                const y = padding.top + graphHeight - (ratio * graphHeight);
                return { x, y, val: d.val, date: d.date.substring(5) };
            });

            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            points.forEach(p => {
                ctx.fillText(p.date, p.x, height - padding.bottom + 5);
            });

            ctx.beginPath();
            ctx.strokeStyle = '#42a5f5';
            ctx.lineWidth = 3;
            ctx.lineJoin = 'round';
            points.forEach((p, i) => {
                if (i === 0) ctx.moveTo(p.x, p.y);
                else ctx.lineTo(p.x, p.y);
            });
            ctx.stroke();

            ctx.beginPath();
            points.forEach((p, i) => {
                if (i === 0) ctx.moveTo(p.x, p.y);
                else ctx.lineTo(p.x, p.y);
            });
            ctx.lineTo(points[points.length - 1].x, padding.top + graphHeight);
            ctx.lineTo(points[0].x, padding.top + graphHeight);
            ctx.closePath();
            const gradient = ctx.createLinearGradient(0, padding.top, 0, padding.top + graphHeight);
            gradient.addColorStop(0, 'rgba(66, 165, 245, 0.4)');
            gradient.addColorStop(1, 'rgba(66, 165, 245, 0.05)');
            ctx.fillStyle = gradient;
            ctx.fill();

            points.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                ctx.fillStyle = '#1e88e5';
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.fillStyle = '#333333';
                ctx.font = 'bold 11px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                ctx.fillText(p.val, p.x, p.y - 8);
            });
        }

        window.addEventListener('DOMContentLoaded', initPage);
    </script>
